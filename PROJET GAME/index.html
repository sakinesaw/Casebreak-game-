<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CODE BREAKER : Le Casse ⚡</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="jeu-container">
        <h1>CODE BREAKER : LE CASSE</h1>
        
        <!-- Le score qui va augmenter -->
        <div class="banque">
            <p>Butin accumulé : <span id="argent">0</span> €</p>
            <p id="passif">Revenu passif : <span id="vitesse-gain">0.00</span> €/s</p>
        </div>

        <!-- Le gros bouton à cliquer  -->
        <div class="zone-coffre">
            <button id="bouton-coffre">FORCER LE COFFRE</button>
        </div>

        <!-- La boutique de hackers -->
        <div class="boutique">
            <h3>Améliorations de Hacker</h3>
            
            <button id="achat-PC" class="bouton-shop">
                <div class="produit">💻 Acheter un PC Élite</div>
                <div>Coût : <span id="prix-pc" class="prix-produit">10.00</span> €</div>
                <div>Possédés : <span id="nb-pc" class="quantite-produit">0</span></div>
            </button>

            <button id="achat-fibre" class="bouton-shop">
                <div class="produit">🌐 Connexion Fibre Pro</div>
                <div>Coût : <span id="prix-fibre" class="prix-produit">50.00</span> €</div>
                <div>Possédés : <span id="nb-fibre" class="quantite-produit">0</span></div>
            </button>

            <button id="achat-serveur" class="bouton-shop">
                <div class="produit">🖥️ Serveur Dédié</div>
                <div>Coût : <span id="prix-serveur" class="prix-produit">250.00</span> €</div>
                <div>Possédés : <span id="nb-serveur" class="quantite-produit">0</span></div>
            </button>

            <button id="achat-ia" class="bouton-shop">
                <div class="produit">🤖 IA de Forçage</div>
                <div>Coût : <span id="prix-ia" class="prix-produit">1250.00</span> €</div>
                <div>Possédés : <span id="nb-ia" class="quantite-produit">0</span></div>
            </button>

            <button id="achat-quantique" class="bouton-shop">
                <div class="produit">⚛️ Calculateur Quantique</div>
                <div>Coût : <span id="prix-quantique" class="prix-produit">7000.00</span> €</div>
                <div>Possédés : <span id="nb-quantique" class="quantite-produit">0</span></div>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
